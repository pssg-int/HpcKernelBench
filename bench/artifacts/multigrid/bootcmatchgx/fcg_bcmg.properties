# kernelbench multigrid adapter settings for BootCMatchGX driverSolve.
#
# FCG (Flexible Conjugate Gradient) + BCMG (BootCMatchGX's own aggregation-
# based AMG preconditioner) -- the paper's own primary configuration
# (README.md's own example, src/test/data/settings/FCG_BCMG.properties).
#
# rtol/itnlim match benchspecs/multigrid/spec.yaml's mg-gpu-e2e-pcg variant
# EXACTLY (BootCMatchGX's own paper protocol: "relative residual < 1e-6,
# capped at 1000 iterations"). prerelax_sweeps/postrelax_sweeps=4 and
# relaxnumber_coarse=20 match the spec's protocol.hierarchy_config text
# verbatim ("4 pre-/post-smoothing l1-Jacobi sweeps ... 20 sweeps at the
# coarsest level") -- these are this properties file's DEFAULTS already
# (src/test/data/settings/sample.properties), reproduced explicitly here so
# the exact configuration used is self-documenting rather than implicit.

solver  = FCG
preconditioner = BCMG

itnlim = 1000
rtol = 1.e-6
dispnorm = 1

bootstrap_type = MULTIPLICATIVE
max_hrc = 10
conv_ratio = 0.6
matchtype = SUITOR
aggrsweeps = 2
aggr_type = 0
max_levels = 39
cycle_type = V_CYCLE
coarse_solver = L1_JACOBI
relax_type = L1_JACOBI
relaxnumber_coarse = 20
smoothed_prolungator = 0
coarsesolver_type = 0
prerelax_sweeps = 4
postrelax_sweeps = 4
