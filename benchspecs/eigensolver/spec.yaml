artifact_repos:
  shengguolsg/PSMMA: >
    Fortran/C (ScaLAPACK-family), license not independently confirmed
    during this pass; URL confirmed from the paper's own in-text citation,
    not independently re-fetched beyond that confirmation. Primary source
    for eigensolver-symmetric-tridiagonal-dc-distributed.
  js1019/NormalModes: >
    C++/MPI (finite-element + pEVSL-based), license badge present in README
    (not independently verified). Depends on companion repos
    `eigs/pEVSL`/`js1019/pEVSL` (polynomial-filtered eigenvalue-slicing
    library, the actual eigensolver engine) and `js1019/PlanetaryModels`
    (mesh/model generator) - NormalModes itself is the FEM-assembly +
    driver layer, not a self-contained eigensolver implementation. Primary
    source for eigensolver-polynomial-filtered-partial-spectrum-kernel's
    tier (a).
  hansheng1001/EVD4SC2025: >
    CUDA/C++, license not independently confirmed. `src/EVD/myEVD.cu` is a
    single-file, single-binary driver (`myEVD <n> <b> <nb>`) covering the
    full 2-stage pipeline including back-transformation, this paper's own
    contribution. Correctness gated behind `CHECH_EVD_RESULT_ENABLE`.
  ynkrue/cuEV (now "ASE — Accelerated Symmetric Eigensolver"): >
    CUDA/C++, MIT license. Successor/consolidation artifact implementing
    BOTH WangDZWZLJZ25 (tridiagonalization) and WangHZSJWDZ25 (back-
    transformation)'s algorithms together, with separate `ase_bench`
    (performance, best-of-N) and `ase_test` (correctness, GoogleTest vs.
    LAPACK dsyevd) targets - primary source for
    eigensolver-dense-symmetric-full-spectrum-kernel, and the model this
    spec's "correctness always required, separately reported if needed"
    principle is drawn from directly.
  YXJ-123/DBMPK: >
    C++/OpenMP, no license file found during this pass (flagged for
