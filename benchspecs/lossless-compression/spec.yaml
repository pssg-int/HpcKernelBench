  conf/sc/HuangD0Z0J00LCC24: "github.com/ZCCLorg/zccl README + jobs/evaluate_compressor_NYX.sh + jobs/different_sizes.sh + examples/testfloat_homocompress_fastmode1_arg.c raw source: Nyx 512^3 6-field fp32 standalone-compressor bench (block size 36, rel eb sweep {1e-1..1e-4}), #define ITERATIONS 1 (no warmup, no repetition), PSNR/NRMSE/max-error correctness (explicitly NOT bit-exact) -- EXCLUDED from core spec variants, see notes_on_fairness"
  conf/asplos/FanYPLLW0026: "github.com/xxyux/ZipServ README + kernel_benchmark/{run.sh,run_all_main.sh,test_mm.cu,test_decompress.cu,utils.h} + LInfer_py/verify_compression.py raw source: WARM_UP_ITERATION=0/BENCHMARK_ITERATION=1 hardcoded CUDA-event microbenchmark, separate ncu-hardware-counter sweep across 14 named LLM families x 8 layer-types x {8,16,32} batch, verify_compression.py checks ONLY downstream GEMM-output cosine similarity >0.999 vs bf16 cuBLAS, never the decompressed weight tensor itself"
