kernel: stencil
summary: >
  Throughput of an iterative structured-grid stencil sweep — a fixed weighted
  sum over a small neighborhood (star or box support) applied to every point of
  a dense D-dimensional grid, repeated for T time steps with double-buffered
  (ping-pong) storage — across three hardware/implementation classes the
  track's papers actually target: general-purpose CPU/GPU compute (spatial and
  temporal blocking), Tensor-Core matmul reformulations (fp16), and full
  domain-application solvers.
operation: >
  U_out[p] = sum_{d in support(shape, radius r)} w_d * U_in[p + d]  for every
  interior grid point p, applied for T sequential time steps via double
  buffering (U_in/U_out swap each step); shape in {star, box}, dims in {1D, 2D,
  3D}; star-r has 2*dims*r+1 support points, box-r has (2r+1)^dims support
  points; halo of width r (periodic or fixed) surrounds the domain.

variants:
  - id: stencil-cpu-gpu-kernel-fp64
    claim: >
      Steady-state per-time-step throughput of an iterative structured-grid
      stencil sweep on general-purpose CPU/GPU compute (SIMD/CUDA-core
      vectorized kernels with spatial and/or temporal blocking), independent
      of any Tensor-Core matmul reformulation. This is the common denominator
      across AN5D, PERKS, K-Athena's core update kernel, Devito's generated
      code, AOStencil, and StencilsOnFPGA.
    inputs:
      suite: >
        AN5D's full radius sweep (star{2d,3d}{1..4}r, box{2d,3d}{1..4}r) —
        not just the 6-shape {1,3}r overlap the 2024-2026 Tensor-Core lineage
        reuses — plus AN5D's six named application kernels (j2d5pt, j2d9pt,
        j2d9pt-gol, gradient2d, j3d27pt).
      workloads:
        - family: "2D star"
          radii: [1, 2, 3, 4]
          points_per_radius: [5, 9, 13, 17]
          grid: "16384 x 16384"
        - family: "2D box"
          radii: [1, 2, 3, 4]
          points_per_radius: [9, 25, 49, 81]
          grid: "16384 x 16384"
        - family: "3D star"
          radii: [1, 2, 3, 4]
          points_per_radius: [7, 13, 19, 25]
          grid: "512 x 512 x 512"
        - family: "3D box"
          radii: [1, 2, 3, 4]
          points_per_radius: [27, 125, 343, 729]
          grid: "512 x 512 x 512"
        - family: "named 2D kernels"
          members: [j2d5pt, j2d9pt, j2d9pt-gol, gradient2d]
          grid: "16384 x 16384"
        - family: "named 3D kernel"
          members: [j3d27pt]
          points: 27
          grid: "512 x 512 x 512"
      named_kernel_semantics: >
        Preserve each named kernel's paper-native equation and arithmetic
        verbatim (including division operations, where present — e.g.
        j2d5pt/j2d9pt's own division-based updates) rather than re-deriving
        it from a synthetic weighted-sum stencil of the same point count.
        j2d9pt is a radius-2 STAR (9 points); j2d9pt-gol is a radius-1 BOX
        (9 points) — equal point counts do NOT establish equivalence between
        the two, and they must never share an implementation.
        VERIFIED 2026-09-23 against AN5D's paper, Table 3 (c = per-point
        coefficient, f = field, c0 = a scalar constant):
          j2d5pt     = (c f(x,y) + sum_{i=+-1} [c f(x+i,y) + c f(x,y+i)]) / c0   radius-1 star, 10 FLOP/cell
          j2d9pt     = same form over i in +-1, +-2                               radius-2 star, 18 FLOP/cell
          j2d9pt-gol = (sum_{i,j in -1..1} c f(x+i,y+j)) / c0                    radius-1 box,  18 FLOP/cell
          gradient2d = c f(x,y) + 1.0 / sqrt(c0 + sum_{i=+-1} [(f(x,y)-f(x+i,y))^2
                         + (f(x,y)-f(x,y+i))^2])                                 radius-1 star, 19 FLOP/cell
          j3d27pt    = (sum_{i,j,k in -1..1} c f(x+i,y+j,z+k)) / c0              radius-1 box,  54 FLOP/cell
        Four of the five end in a division by c0, and gradient2d is not a
        weighted sum at all (square, sqrt, reciprocal), so it falls outside
        this spec's `operation` definition and needs its own reference.
        Implemented 2026-09-23 in kernelbench/domains/stencil.py (NAMED):
        coefficients transcribed from the artifact's .c files (float-rounded,
        as the `f` literals are), reference sums then divides. The AN5D
        adapter does not bridge them yet and reports them unsupported.
        GATE CAVEAT: these coefficients sum below the divisor (per step
        j2d5pt 0.42, j2d9pt/-gol 0.70, j3d27pt 0.15), so at AN5D's T=1000
        j2d5pt and j3d27pt underflow to exactly 0 and the correctness gate
        is vacuous; the reference warns, and correctness should be gated at
        a small T (e.g. `j2d5pt:T=50`).
      resource_classes: >
        256^3 is a separate, OPTIONAL resource class for 3D shapes only, for
        resource-constrained targets — not a substitute for the 512^3
        primary grid, and its results must not be averaged or plotted
        together with 512^3 results.
      selection: >
        Two tiers. The 6 shapes shared by AN5D and the whole Tensor-Core
        lineage's public CLI are the COMPARABILITY OVERLAP — star2d1r,
        box2d1r, star2d3r, box2d3r, star3d1r, box3d1r — so variant 1 and
        variant 2 stay directly comparable on them. The DEFAULT RUN SET is the
        full radius 1-4 sweep listed in recommended_subset below (16 synthetic
        shapes plus AN5D's five named kernels, all of which AN5D's own
        Figure 6 and Table 5 report); the overlap is a subset of it, not a
        replacement for it.
      recommended_subset:
        - star2d1r        # 5-point 2D star (Jacobi-5pt equivalent)
        - star2d2r        # 9-point 2D star, radius 2
        - star2d3r        # 13-point 2D star, radius 3
        - star2d4r        # 17-point 2D star, radius 4
        - box2d1r         # 9-point 2D box
        - box2d2r         # 25-point 2D box, radius 2
        - box2d3r         # 49-point 2D box, radius 3
        - box2d4r         # 81-point 2D box, radius 4
        - star3d1r        # 7-point 3D star (Jacobi-7pt equivalent)
        - star3d2r        # 13-point 3D star, radius 2
        - star3d3r        # 19-point 3D star, radius 3
        - star3d4r        # 25-point 3D star, radius 4
        - box3d1r         # 27-point 3D box
        - box3d2r         # 125-point 3D box, radius 2
        - box3d3r         # 343-point 3D box, radius 3
        - box3d4r         # 729-point 3D box, radius 4
        - j2d5pt           # AN5D named kernel, radius-1 star with /c0
        - j2d9pt           # AN5D named kernel, radius-2 star with /c0
        - j2d9pt-gol       # AN5D named kernel, radius-1 box with /c0
        - gradient2d       # AN5D named kernel, nonlinear (sqrt); weight-based adapters refuse it
        - j3d27pt          # AN5D named kernel, 27-point box with /c0
        - rtm3d25p8th      # StencilsOnFPGA's 25-point 8th-order 3D RTM stencil, as a high-order stress test — NOT implemented in this domain module yet (see kernelbench/domains/stencil.py PLANNED); documented as a target, not a currently-runnable id
      dense_operand: >
        single scalar field per grid point, fp64 primary / fp32 secondary at
        the same tolerance, initialized U(0,1) random or index-fill (no
        cherry-picked "nice" data — both AN5D and ConvStencil's harnesses use
        random fill by default).
      grid_sizes: >
        2D: 16384 x 16384 (AN5D's synthetic-suite convention, matches
        AOStencil's ARM sweep band of 8192-24576). 3D: 512^3 (AN5D's 3D
        convention == Devito's 512^3 velocity model, == CLAIRE's 256^3-512^3
        range). Small-class 3D: 256^3, optional (see resource_classes above),
        for resource-constrained targets (matches K-Athena's
        single-node/roofline size and gives FPGA-class implementations a
        reachable point; StencilsOnFPGA itself only reaches 50^3-400^2 due to
        on-chip capacity and is reported separately, not forced onto this
        grid).
      boundary: >
        periodic wrap or fixed halo of width r; halo fill/exchange is EXCLUDED
        from the timed region (single-node/single-device kernel-only claim;
        distributed halo exchange belongs to variant 3).
    protocol:
      iteration_count: >
        T=1000 back-to-back sweeps (AN5D's primary-benchmark convention). If a
        single T=1000 trial's wall time would fall under 400 ms on the target
        device, calibrate T upward (AN5D/PERKS's own adaptive-warmup logic:
        run once, measure, scale T so the timed trial clears the floor) and
        report the calibrated T explicitly — never silently substitute a
        shorter, noisier trial.
      warmup: >
        1 full T-iteration trial, discarded (AN5D's own convention; also
        matches PERKS's `--warmup` calibration run).
      reps: 5
      statistic: >
        median (report min and max alongside it). This deliberately departs
        from AN5D's own "average of 5" — median is robust to the occasional
        outlier trial that a mean silently absorbs, and none of the other
        surveyed papers in this variant's family report a distribution at all,
        so there is no existing convention this contradicts.
      timer: >
        device-side event pair (CUDA/HIP events) for GPU targets; wall clock
        (`clock_gettime(CLOCK_MONOTONIC)` or `omp_get_wtime()`) with an
        explicit device/thread synchronization barrier at trial start and stop
        for CPU/ARM targets (AOStencil's own `omp_get_wtime()` convention).
      timing_scope: >
        kernel(s) only. Excludes H2D/D2H transfer (AN5D explicit), array
        allocation and initialization, and any halo exchange. Each trial times
        all T sweeps as ONE elapsed interval (every surveyed paper bulk-times
        T iterations; none times sweeps individually — see survey.md
        Divergence 1), then divides by T for the reported per-step figure.
      preprocessing_reported: >
        not applicable to this variant in general (no format conversion in
        this compute class); if a codegen/autotuning implementation
        (AN5D, AOStencil's GA tuner, Devito's autotuner) has a nonzero
        kernel-search or compile time, report it once, separately, and never
        amortize it into the per-step throughput.
    metric:
      primary: >
        elapsed ms per T-iteration trial, plus GCell-updates/s =
        logical_cells_updated * T / elapsed_s / 1e9, where
        logical_cells_updated excludes any redundant halo-cell recomputation
        (see the track-level `metrics` section below for the full
        definition, the speedup-reporting rule, and each paper's own
        supplementary counters, which are reported ALONGSIDE, never merged
        into, this number).
      secondary:
        - "GFLOP/s — the FLOPs-per-point-update convention MUST be stated per stencil (e.g. PERKS counts 17 FLOP/update for its 9-point kernel); treat as informational only, NOT comparable across papers with an undisclosed convention (survey.md Divergence 4)"
        - "GB/s effective bandwidth (bytes moved = 2 * grid_points * sizeof(dtype) per sweep, read+write of ping-pong buffers)"
    correctness: >
      max relative error <= 1e-5 vs. an unblocked/unoptimized reference sweep
      of the same stencil, same precision, run for the same T (PERKS's
      `TOLERANCE=1e-5` and AOStencil's `1e-5` check both already use this
      threshold). fp32 secondary pass: same 1e-5 relative-error gate against an
      fp32 reference (not fp64 — comparing an fp32 kernel to an fp64 reference
      conflates precision loss with implementation bugs).
      GATE STEP COUNT: when a reference run of the full T would take too long
      on the CPU, the gate runs on the SAME grid, shape, coefficients and
      boundary for fewer steps (budget-limited, same parity as T, and at
      least one temporal block of every bridged AN5D kernel), and only then is
      the full-T run timed. The result records the gated step count under
      protocol_used.correctness_gate (kernelbench/domains/stencil.py
      gate_workload; budget KB_STENCIL_GATE_POINT_OPS).

  - id: stencil-tcu-matmul-kernel-fp16
    claim: >
      Throughput of stencil-as-(sparse)-matrix-multiplication reformulations
      executing on Tensor Cores / Sparse Tensor Cores at fp16, with the
      one-shot layout/format-construction preprocessing excluded from the
      timed sweep loop but measured once and reported separately (not merely
      excluded and left unquantified, as SPIDER's own artifact does).
    inputs:
      suite: >
        Named-kernel catalog shared across ConvStencil, LoRAStencil,
        FlashFFTStencil, and SPIDER's own CLIs (`{program} shape input_size
        time_iteration_size [options]`), extended past the original 7-shape
        {1d1r,1d2r,star2d1r,box2d1r,star2d3r,box2d3r,star3d1r,box3d1r} overlap
        with the radius-2 2D cases (Star-2D9P/Box-2D25P) and the radius-3 1D
        case (1D7P) needed to cover FlashFFTStencil's and SPIDER's own
        reported points.
      named_kernels:
        - {id: Heat-1D,     geometry: "1D, radius 1", points: 3,  shape_id: 1d1r,     grid: "1 x 10,240,000", time_steps: 100000}
        - {id: 1D5P,        geometry: "1D, radius 2", points: 5,  shape_id: 1d2r,     grid: "1 x 10,240,000", time_steps: 100000}
        - {id: 1D7P,        geometry: "1D, radius 3", points: 7,  shape_id: 1d3r,     grid: "1 x 10,240,000", time_steps: 100000}
        - {id: Heat-2D,     geometry: "star, radius 1", points: 5,  shape_id: star2d1r, grid: "10240 x 10240", time_steps: 10240}
        - {id: Star-2D9P,   geometry: "star, radius 2", points: 9,  shape_id: star2d2r, grid: "10240 x 10240", time_steps: 10240}
        - {id: Star-2D13P,  geometry: "star, radius 3", points: 13, shape_id: star2d3r, grid: "10240 x 10240", time_steps: 10240}
        - {id: Box-2D9P,    geometry: "box, radius 1", points: 9,  shape_id: box2d1r,  grid: "10240 x 10240", time_steps: 10240}
        - {id: Box-2D25P,   geometry: "box, radius 2", points: 25, shape_id: box2d2r,  grid: "10240 x 10240", time_steps: 10240}
        - {id: Box-2D49P,   geometry: "box, radius 3", points: 49, shape_id: box2d3r,  grid: "10240 x 10240", time_steps: 10240}
        - {id: Heat-3D,     geometry: "star, radius 1", points: 7,  shape_id: star3d1r, grid: "1024^3", time_steps: 1024}
        - {id: Box-3D27P,   geometry: "box, radius 1", points: 27, shape_id: box3d1r,  grid: "1024^3", time_steps: 1024}
      grid_3d: >
        1024^3 is paper-reported, not a candidate: ConvStencil (Table 4) and
        LoRAStencil (Table II) both evaluate Heat-3D and Box-3D27P at
        1024 x 1024 x 1024. LoRAStencil states T=1024; ConvStencil's Table 4
        gives no time-step count for 3D, so T=1024 is taken from LoRAStencil.
        FlashFFTStencil's own 3D size is 768^3 at T=1000 and stays in
        extended_experiments.flashfftstencil_native_large_cases; SPIDER has
        no 3D kernel. No variant-2 adapter in this harness runs 3D yet, so
        these two rows are recorded as unsupported until one does.
      selection: >
        Every shape all 4 baseline-cluster papers implement in common, plus
        the radius-2/radius-3 extensions above, plus the two 3D kernels at
        the ConvStencil/LoRAStencil size (see grid_3d).
      recommended_subset:
        - 1d1r        # Heat-1D
        - 1d2r        # 1D5P
        - 1d3r        # 1D7P — extends the shared suite for FlashFFTStencil/SPIDER
        - star2d1r    # Heat-2D
        - star2d2r    # Star-2D9P — extends the shared suite
        - star2d3r    # Star-2D13P
        - box2d1r     # Box-2D9P
        - box2d2r     # Box-2D25P — extends the shared suite
        - box2d3r     # Box-2D49P
        - star3d1r    # Heat-3D, 1024^3, T=1024
        - box3d1r     # Box-3D27P, 1024^3, T=1024
      dense_operand: fp16 grid values (TF32/mixed-precision accumulation as the kernel dictates), random-initialized.
      grid_sizes: >
        1D: 1 x 10,240,000 (SPIDER's Figure10_run.sh / ConvStencil-lineage
        convention). 2D: 10240 x 10240 (SPIDER/ConvStencil/LoRAStencil's
        shared primary evaluation point; also swept 512..10240 per side in
        SPIDER's Figure11). 3D: 1024^3 (ConvStencil Table 4, LoRAStencil
        Table II), see grid_3d.
      paper_configurations:
        convstencil_block_sizes: >
          Published entries: 1024 (1D), 32x64 (2D), 8x64 (3D). Record these
          verbatim as paper-reported configuration metadata alongside any
          ConvStencil result. Do NOT assume these are literal CUDA
          thread-block (blockDim) dimensions without verifying their meaning
          against the artifact source first — the paper's own terminology
          for these numbers was not confirmed during the track survey.
        lorastencil_1d_timesteps: >
          LoRAStencil (SC'24) Table II: Heat-1D and 1D5P at 10,240,000
          points x T=10,000. ConvStencil (Table 4) and SPIDER's Figure10
          script use T=100,000 for the same grid. Record the T used on every
          1D result; results at the two T values are separate cases.
        convstencil_3d_timesteps: >
          ConvStencil's Table 4 lists Heat-3D/Box-3D27P as "1024 x 1024 x
          1024" with no time-step count (its 1D/2D rows append T). Treat
          its 3D T as unstated, not as 1024.
      precision_cohorts: >
        This variant's fp16 protocol is a REPRODUCTION configuration, not
        each paper's own published evaluation: ConvStencil, LoRAStencil, and
        FlashFFTStencil all published their headline numbers at FP64. Retain
        each paper's own reported precision as metadata on any imported
        (paper-reported) number, and keep any FP64 reproduction run under
        this variant's protocol in a separate reporting cohort from FP16
        reproduction runs — never average or plot the two cohorts together.
    protocol:
      iteration_count: >
        T=10,240 for 2D, T=100,000 for 1D — the literal `time_iteration_size`
        values SPIDER's own reproduction script (Figure10_run.sh) uses to
        drive the ConvStencil/LoRAStencil/SPIDER binaries, so this is not an
        invented number but the value this paper family already runs its own
        baselines at, and ConvStencil's Table 4 value for 1D. EXCEPTION:
        LoRAStencil's own Table II runs 1D at T=10,000, not 100,000 — to
        reproduce LoRAStencil's published 1D numbers use T=10,000 (see
        inputs.paper_configurations.lorastencil_1d_timesteps). 3D: T=1024
        (LoRAStencil Table II; ConvStencil does not state its 3D T).
      warmup: >
        1 full T-iteration trial, discarded. THIS IS A DELIBERATE FIX: none of
        ConvStencil, LoRAStencil, FlashFFTStencil, or SPIDER's public
        benchmark harnesses run a discarded warmup trial before the timed
        region (survey.md Divergence 2).
      reps: 5
      statistic: >
        median (report min/max). FIX: all 4 surveyed repos as published report
        a single, unrepeated trial.
      timer: >
        device-side (CUDA events, matching SPIDER's own `cudaEventRecord`
        usage) wrapping all T kernel launches as one interval. A host
        `std::chrono` timer (ConvStencil/LoRAStencil's own convention) is
        acceptable only if it brackets a single `cudaDeviceSynchronize()`
        after all T launches — SPIDER's own implementation instead
        synchronizes after every individual launch inside the timed loop,
        which inflates measured time with T-1 extra sync-barrier stalls; this
        spec requires the single-sync form for both timer choices.
      timing_scope: >
        matmul/MMA kernel(s) only; H2D/D2H excluded. The one-shot
        format/layout transform — parameter-matrix packing, sparse-metadata
        compression for `mma.sp` encoding, im2col-equivalent layout
        construction, or FFT-plan creation (FlashFFTStencil) — is excluded
        from the T-iteration timed loop.
      preprocessing_reported: >
        measured once, separately, and reported as (1) its own number (ms),
        (2) a "break-even iteration count" (preprocessing_ms /
        per-iteration_ms), AND (3) a combined "setup+solve" wall time
        (preprocessing_ms + T * per-iteration_ms) so a reader can compare
        end-to-end cost without re-deriving it from the other two numbers.
        FIX: SPIDER's paper text states this cost is excluded from its
        throughput figures and is not otherwise quantified as a number in the
        public artifact for any of the 4 papers in this family; this variant
        requires it be measured, not just excluded (survey.md Divergence 5).
    metric:
      primary: >
        elapsed ms per T-iteration trial, plus GCell-updates/s a.k.a.
        GStencil/s (this family's own native metric) = logical_cells_updated
        * T / elapsed_s / 1e9, where logical_cells_updated excludes any
        redundant halo-cell recomputation (see the track-level `metrics`
        section below for the full definition and each paper's own
        supplementary counters).
      secondary:
        - "effective TFLOP/s on tensor cores (informational; FLOP convention must be stated — ConvStencil's printed x3 is temporal fusion, resolved in metrics.per_paper_native.convstencil)"
        - "speedup vs. cuDNN im2col-convolution baseline on the same GPU (the one baseline shared by ConvStencil, LoRAStencil, and SPIDER)"
    correctness: >
      max relative error vs. an fp64 CPU or GPU reference sweep of the same
      stencil/grid/T (or fewer steps, see variant 1's GATE STEP COUNT). No surveyed repo's public artifact states an explicit
      fp16 tolerance (ConvStencil's own 1e-7 check exists in source but is
      compiled out by default, and it is a fp64-path check, not fp16 — see
      survey.md's ConvStencil subsection). This spec recommends <= 1e-2
      relative error as an fp16-appropriate default; treat as an OPEN
      QUESTION pending confirmation from a paper that actually states one.

  - id: stencil-e2e-application
    claim: >
      End-to-end wall-clock speedup of a full domain-application solver (whole
      program: boundary handling, multi-kernel physics, no I/O) over its own
      unoptimized/decomposed baseline, for a domain-realistic, CFL- or
      convergence-order-determined number of steps — reported ALONGSIDE, never
      substituted for, a kernel-only number from variant 1/2 when both exist
      for the same code (WindStencil's own README already separates
      "kernel-focused gain" from "full-application gain"; this variant
      standardizes that split for the whole track).
    inputs:
      suite: >
        Domain-standard test problems rather than a synthetic grid sweep,
        because grid shape and physics genuinely differ per code and forcing a
        common synthetic grid onto them would misrepresent what the paper
        measured: linear fast-magnetosonic MHD wave (K-Athena/Athena++ test
        suite), isotropic/TTI acoustic + isotropic elastic wave propagation
        (Devito/Bisbas seismic-imaging setups), the Williamson shallow-water
        test suite — steady-state geostrophic flow / Rossby-Haurwitz wave /
        perturbed jet (ozHOPE/HOPE), and compressible Navier-Stokes CFD ducts
        (WindStencil/OpenCFD-SC).
      selection: "one problem per paper's own primary evaluation case, at the paper's own default resolution; no cross-paper size unification (see survey.md Divergence 6)."
      recommended_subset:
        - "K-Athena: linear fast magnetosonic wave, 256^3, fp64"
        - "Devito/Bisbas: isotropic acoustic, space order 4, 512^3, 228 CFL-determined time steps, fp32"
        - "WindStencil: 480x512x64 (single-MI60 case) and the 9600x256x256 strong-scaling case, 1000 iterations, fp64"
        - "ozHOPE: Williamson steady-state geostrophic flow, HOPE's default resolution, Ozaki fp16-emulated-fp64"
      grid_sizes: "paper-native; see recommended_subset. Physically motivated, not drawn from a shared microbenchmark convention."
    protocol:
      iteration_count: >
        paper-native: CFL/physics-determined where applicable (Devito
        228-587 steps) or the fixed round count the paper itself used for its
        headline number (WindStencil: 1000 for the performance number, 10,000
        for the correctness check; K-Athena: "several runs" of full production
        cycles).
      warmup: >
        1 full run discarded, if the harness supports separating setup from
        the timed loop; otherwise report this as a deviation from variant
        1/2's protocol rather than silently pretending it happened (many
        full-application codes fold one-time mesh/IC setup into the single
        measured run and cannot cheaply discard a "warmup" run of a
        physics simulation).
      reps: 3
      statistic: >
        median (report min/max). K-Athena's own convention — 80th percentile
        of per-cycle rate across several runs — is an acceptable ALTERNATE
        statistic specifically for weak/strong-scaling sub-variants where
        network variance dominates; report explicitly which statistic was
        used and never mix the two within one reported number.
      timer: "wall clock around the whole program's compute loop; initialization/I-O excluded only if the harness cleanly separates them."
      timing_scope: >
        end-to-end whole-program compute time (all kernels + boundary/physics
        glue). Report this NUMBER TOGETHER WITH, never in place of, the
        single-dominant-kernel number from variant 1/2 for the same
        optimization when the paper's artifact exposes both (WindStencil's own
        table already does this split; this spec makes it mandatory rather
        than paper-specific).
      preprocessing_reported: "mesh/initial-condition setup and any one-time solver initialization reported once, separately, never amortized into the per-step throughput."
    metric:
      primary: "wall-clock speedup vs. the paper's own unoptimized/baseline implementation on the same hardware"
      secondary:
        - "cell-updates/s or GPoints/s for the dominant stencil kernel (comparable to variant 1's primary metric when the paper also reports a kernel-only number)"
        - "% of hardware FP64 peak / roofline-attainable peak, when the paper reports operational intensity (K-Athena, WindStencil both do)"
    correctness: >
      domain-specific, and DELIBERATELY WEAKER than variant 1/2's pointwise
      tolerance gate — flagged as an open question rather than silently
      equated to it: either conserved-quantity relative drift over the full
      run (WindStencil: total energy/temperature, <= 1e-4, compared between
      optimized and unoptimized runs of the SAME code, not against an
      independent reference) or pointwise comparison vs. an FP64 reference
      solution for a standard test case (ozHOPE's Williamson cases).

extended_experiments:
  note: >
    Cases needed to reproduce specific paper claims beyond the shared-suite
    variants above. These are OPT-IN / on-demand — not part of the default
    variant 1/2 run matrix, and not run automatically by ./smoke_all.sh or a
    bare --variant invocation.
  an5d_temporal_blocking:
    claim: "AN5D: effect of temporal-blocking degree bT"
    cases: >
      Sweep bT in [1,16] for 2D and [1,8] for 3D, on the variant-1 AN5D grids
      (16384^2 2D / 512^3 3D).
  an5d_radius_and_tuning:
    claim: "AN5D: radius sweep and autotuning vs. default/model-selected config"
    cases: >
      Retain all radii 1-4 (including the 125-point 3D box, radius 2);
      compare AN5D's model-selected/default configuration against its own
      tuned-parameter-search configuration. Preserve the named kernels'
      division operations (j2d5pt/j2d9pt's division-based arithmetic must
      not be replaced by a multiply-only approximation).
  convstencil_fusion_across_sizes:
    claim: "ConvStencil: fusion behavior across problem size"
    cases: >
      Figure 8, ConvStencil vs. DRStencil with 3-step fusion: Heat-2D and
      Box-2D9P at side lengths 256-5120 in steps of 256; Heat-3D and
      Box-3D27P at side lengths 64-1024 in steps of 32. The paper does not
      state T for this sweep.
  convstencil_optimization_ablation:
    claim: "ConvStencil: per-optimization contribution"
    cases: >
      Figure 6, on Heat-1D, Box-2D9P and Box-3D27P at the Table 4 sizes:
      explicit vs. implicit stencil2row; CUDA-core vs. Tensor-Core path;
      padding; dirty-bits padding — five cumulative stages (I-V).
  lorastencil_coefficient_rank:
    claim: "LoRAStencil: best case with a rank-1 weight matrix ('LoRAStencil-Best', Figure 8)"
    cases: >
      All 8 Table II kernels (Heat-1D, 1D5P, Heat-2D, Box-2D9P, Star-2D13P,
      Box-2D49P, Heat-3D, Box-3D27P) at the Table II sizes, run twice: with
      the default symmetric weights and with a rank-1 weight matrix. Record
      the actual weights and their rank with each result (rank is a property
      of the coefficients chosen, not a free parameter). Note LoRAStencil
      assumes radially symmetric weights throughout.
  lorastencil_optimization_ablation:
    claim: "LoRAStencil: per-stage optimization contribution"
    cases: >
      Box-2D9P at side lengths 256-5120 in steps of 256; compare RDG-CUDA,
      RDG-TC, BVS, and asynchronous-copy stages against each other.
  flashfftstencil_native_large_cases:
    claim: "FlashFFTStencil: its own largest reported problem sizes"
    cases: >
      Table 3 / Figure 6 (H100): Heat-1D, 1D5P, 1D7P at 512M = 536,870,912
      points; Heat-2D and Box-2D9P at 16K^2 = 16384^2; Heat-3D and
      Box-3D27P at 768^3; all at T=1000. Variant 2's default 3D grid is
      ConvStencil/LoRAStencil's 1024^3 (see inputs.grid_3d).
  flashfftstencil_optimization_ablation:
    claim: "FlashFFTStencil: per-stage optimization contribution (Figure 7)"
    cases: >
      Heat-1D on A100 with six-step temporal fusion, at 128K, 256K, 384K,
      512K, 768K, 1M, 2M, 4M, 8M, 16M, 24M, 32M, 64M, 128M, 256M, 512M, 768M
      and 1024M points; five cumulative stages: standard cuFFT stencil,
      kernel tailoring on CUDA cores, kernel tailoring on Tensor Cores,
      + architecture aligning, full FlashFFTStencil.
  flashfftstencil_temporal_fusion:
    claim: "FlashFFTStencil: temporal-fusion depth sensitivity"
    cases: >
      Figure 9: 1D temporal fusion depth 1-13 inclusive, on A100 and H100,
      against fft- and rfft-based stencils; explicitly including depth 6 (the
      paper's own headline fusion depth). The paper does not state the 1D
      problem size for this figure. See timestep_and_alignment_handling
      below — depth 6 is a reported operating point, not evidence of a
      6-divisibility alignment requirement.
  flashfftstencil_memory_scaling:
    claim: "FlashFFTStencil: memory-footprint scaling / OOM boundary"
    cases: >
      Figure 8: Heat-1D at 128M/256M/512M/768M/1024M points; Box-2D9P at
      side lengths 8K/12K/16K/24K/32K. Record OOM outcomes explicitly as a result value,
      not as a discarded run failure.
  spider_1d_scaling:
    claim: "SPIDER: 1D throughput vs. problem size"
    cases: >
      Figure 11 (scripts/Figure11_run.sh): 1D1R and 1D2R at 1024 x N points
      for N = 1024, 2048, 4096, 6144, ..., 40960 (1024 and then steps of
      2048; 21 sizes, 1,048,576 to 41,943,040 points), T=10,000. The paper
      text says the range starts at 1024 x 256; the script starts at
      1024 x 1024.
  spider_2d_scaling:
    claim: "SPIDER: 2D throughput vs. problem size and radius"
    cases: >
      Figure 11 (scripts/Figure11_run.sh): Box-2D1R, Box-2D2R and Box-2D3R
      at side lengths 512 to 10240 in steps of 512 (20 sizes), T=10,240.
      SPIDER's own bars come from its one radius-7 kernel, rescaled per
      radius (see metrics.per_paper_native.spider.plotted_normalization).
  spider_optimization_ablation:
    claim: "SPIDER: per-stage optimization contribution"
    cases: >
      Figure 12: Box-2D2R (25 points) at side lengths 1280, 2560, 5120,
      10240, T=10,000; compare TCStencil (baseline), SPIDER with dense
      Tensor Cores, with sparse Tensor Cores, and with sparse Tensor Cores +
      computing optimizations.
  spider_general_coefficients_and_row_swap:
    claim: "SPIDER: general (asymmetric) coefficients and row-swapping"
    cases: >
      Asymmetric (non-symmetric) coefficient sets, plus the radius-7 2D box
      (225 points) as the row-swap experiment (Table 3: memory throughput
      and instruction count with vs. without runtime row swapping). The
      paper does not state the grid size for Table 3; report any run of it
      as out-of-convention (see open_questions).
  how_to_run: >
    Any case above is runnable from the CLI: `--matrices
    <shape>@<grid>:T=<n>` (e.g. box2d2r@5120x5120:T=10000), or
    `--matrices sweep:<id>` for the fully specified ones -- an5d-native,
    convstencil-native, lorastencil-native, flashfftstencil-native,
    spider-native, spider-1d-scaling, spider-2d-scaling, spider-ablation
    (kernelbench/domains/stencil.py SWEEPS). Experiments whose paper does
    not state T have no sweep id on purpose; pass ":T=" explicitly and
    record the value used.
  timestep_and_alignment_handling: >
    FlashFFTStencil's "6" is its own fused-temporal-block depth, not an
    established requirement that global grid dimensions be divisible by 6 —
    do not impose a 6-divisibility precondition on grid sizes without
    verifying an actual alignment/padding restriction in the implementation
    itself. Whatever the requested time-step count is, handle the remainder
    exactly (e.g. via a partial final fused block); never silently round the
    requested step count up or down to a multiple of the fusion depth.

metrics:
  primary: >
    For every kernel case (default variants AND extended_experiments):
    elapsed time (ms) and GCell-updates/s = logical_cells_updated * T /
    elapsed_s / 1e9, where logical_cells_updated excludes any redundant
    halo-cell recomputation (counts only the interior/output points the
    stencil is defined to update, not any padded or halo cells a specific
    implementation happens to also touch).
  speedup: >
    Reported against a named, compatible baseline for every case — never a
    bare absolute number with no comparator — e.g. cuDNN im2col for the
    Tensor-Core lineage, or the same code's own spatially-blocked-only build
    for a temporal-blocking claim. Each paper is additionally compared against
    the baselines ITS OWN evaluation used (paper_baselines below), measured on
    the same GPU, precision and workload.
  per_paper_additional:
    an5d:
      - "GFLOP/s or TFLOP/s (paper's own FLOP-per-update convention, stated explicitly)"
      - "fraction of peak performance"
      - "registers/thread and register spills"
      - "autotuning-model accuracy: measured vs. model-predicted throughput"
    convstencil:
      - "uncoalesced global memory accesses (%)"
      - "shared-memory bank conflicts per request"
    lorastencil:
      - "shared-memory load/store/total requests"
      - "Compute/SM throughput (%)"
      - "arithmetic intensity (FLOP/byte)"
    flashfftstencil:
      - "memory footprint (GB) and OOM status"
      - "uncoalesced global memory accesses (%)"
      - "shared-store bank conflicts per request"
      - "Tensor Core pipeline utilization (%)"
      - "arithmetic intensity"
      - "zero fraction in Tensor Core fragments (%)"
    spider:
      - "row-swap bandwidth (GB/s)"
      - "row-swap instruction count (thousands) and duration (microseconds)"
      - "modeled operations and input/parameter accesses per update — labeled explicitly as MODELED, not measured, and never merged with counters read from a profiler"
  reporting_rule: >
    Report MORE than one number per result, not a single unified one. Every
    result record carries (1) the common metrics in `primary` above, so runs
    stay comparable across papers, AND (2) every paper-native metric below
    that applies to the implementation being run (its own paper's list) and,
    where a baseline is named in `speedup`, that baseline's own paper's list
    too. Each value is labeled with its paper, its class (legend below), and
    the paper's own definition, unmodified. A native metric this harness
    cannot collect (needs a profiler, a model, an FPGA, or a simulator) is
    recorded as "not collected" with the reason — never dropped silently,
    never zero-filled, never re-derived under a different definition.
  metric_class_legend:
    timing: "derivable from the harness's own timed region (elapsed time, cell updates, effective bytes, or a FLOP count under a STATED per-point convention)"
    profiler: "needs a hardware-counter or profiling tool (ncu/nvprof, Intel Advisor, LIKWID, Nsight); not collected by ./smoke_all.sh or a bare --variant run"
    derived: "a paper's own normalization applied to a measured value (e.g. SPIDER's fp16->fp64 /4 and radius 7/r rescaling); shown for comparison with the paper's figures, never ranked against a measurement"
    model: "produced by the paper's own analytical or roofline model, not measured; must be labeled MODELED and never merged with a measured value"
    hw: "specific to the paper's platform (FPGA synthesis reports and power tools, RTL simulation traces, multi-node scaling runs); only collectable on that platform"
    accuracy: "a numerical-quality or physical-validity measure rather than a speed measure"
  per_paper_native:
    note: >
      Covers only the 5 papers with a working adapter in this harness (an5d,
      convstencil, lorastencil, flashfftstencil, spider). The other 16 papers
      in the track are not part of this spec: 4 were tried and skipped in
      integration (PERKS, ozHOPE, K-Athena, WindStencil), 1 was never tried
      but is named by variant 3 (Bisbas/Devito), and 11 have no path to this
      harness (AOStencil, StencilsOnFPGA, SARIS, StencilFlow, YaskSite,
      Futhark-mem, HLS Transformations, CLAIRE, Dendro-GR, Rise, PrecTuner).
      Their metric lists are reference material in survey.md's metrics
      addendum, to be promoted into this block if an adapter is ever built.
      Consequence: variant 3 (stencil-e2e-application) currently has no
      paper-native metric list here, because none of its papers is integrated.
      source_quality states how each entry was obtained: `fulltext` = read
      from the paper's evaluation section; `repo` = paper text unavailable,
      taken from the artifact README/driver source. `variant` is a suggested
      home, not a constraint. The five papers' profiler counters stay in
      per_paper_additional above, not duplicated here.
    an5d:
      variant: stencil-cpu-gpu-kernel-fp64
      source_quality: fulltext (ar5iv 2001.01473)
      native_primary: "[timing] GFLOP/s = FLOP/Cell x cell updates / kernel time, Table 3 FLOP/Cell: star2d{x}r 8x+1, box2d{x}r 2(2x+1)^2-1, star3d{x}r 12x+1, box3d{x}r 2(2x+1)^3-1, j2d5pt 10, j2d9pt 18, j2d9pt-gol 18, gradient2d 19, j3d27pt 54. Figures 5-6 plot TFLOP/s with GCell/s on the second axis. Mean of 5 runs after 1 warm-up, PCIe excluded, >= 400 ms per instance; 16384^2 / 512^3, 1000 iterations"
      also_reports:
        - "[model] model performance (GFLOP/s): expected run time = total_comp / (peak_comp x eff_ALU), and model accuracy = tuned / model (paper reports 16-89% across devices)"
        - "[timing] percent of peak compute (paper examples: 41%, 51%)"
        - "[hw] measured external-memory throughput from BabelStream (P100 535-540 GB/s, V100 791-805 GB/s) and shared-memory throughput from gpumembench, used as ceilings"
        - "[profiler] registers per thread (capped with -maxrregcount 32/64/96) and register spills; shared-memory footprint in bytes"
        - "[model] eff_SM (SM utilization), eff_ALU (ALU utilization), global and shared-memory traffic in bytes, shared-memory reads/writes per thread"
        - "[timing] performance versus temporal-blocking degree bT"
    convstencil:
      variant: stencil-tcu-matmul-kernel-fp16
      source_quality: fulltext (microsoft.com ppopp24_ConvStencil.pdf, §5.1) plus repo (src/2d/gpu.cu)
      native_primary: "[timing] GStencils/s (a.k.a. GCells/s), paper Eq. 16: GStencils/s = T * prod_x N_x / (t * 1e9), T = iteration rounds, N_x = problem size per dimension, t = execution time. Paper runs FP64 on A100; Table 4: Heat-1D/1D5P 10240000 x 100000, 2D kernels 10240^2 x 10240, 3D kernels 1024^3"
      multiplier_resolved: >
        The x3 in the artifact's printed formula (input_m*input_n*times*3) is
        temporal fusion, not an extra count: for radius-1 shapes each launch is
        a 3-step fused kernel (halo=3; main.cu builds the 7x7 weights as the
        3-fold self-convolution of the 3x3), and `times` counts launches, so
        times*3 = real time steps. The x2 in gpu_2r.cu is the same for 2-step
        fusion. Eq. 16 with T = real steps is therefore identical to
        GCell-updates/s. Checked against the paper's own README example:
        box2d1r 10240^2, 10240 launches, 17109 ms -> 188.27 printed; Eq. 16
        with T = 30720 real steps gives 188.28.
      also_reports:
        - "[timing] speedup vs cuDNN (FWD_IMPLICIT_PRECOMP_GEMM), AMOS, Brick, DRStencil, and TCStencil / 4 (FP16->FP64 normalization)"
        - "counters: see per_paper_additional.convstencil (Table 5: UGA %, BC/R)"
    lorastencil:
      variant: stencil-tcu-matmul-kernel-fp16
      source_quality: fulltext (likun.tech sc24_lorastencil.pdf, §V-A) plus repo (src/2d/gpu.cu)
      native_primary: "[timing] GStencil/s, paper Eq. 18: GStencil/s = T * prod_i N_i / (t * 1e9), T = iterations, t = total execution time in seconds. Paper runs FP64 on A100; Table II: Heat-1D/1D5P 10240000 x 10000, 2D kernels 10240^2 x 10240, 3D kernels 1024^3 x 1024"
      also_reports:
        - "[timing] speedup vs cuDNN, AMOS, Brick, DRStencil, TCStencil / 4, ConvStencil (paper: 1.12x-2.16x, 1.37x average over ConvStencil)"
        - "PROTOCOL NOTE: uses the same 3-step temporal fusion as ConvStencil for small kernels (§V-A), printed as times*3 in gpu.cu; the wrapped gpu_star_2d3r prints T*m*n/t with no multiplier"
        - "counters: see per_paper_additional.lorastencil (Fig. 10 shared-memory requests; Table: CT %, AI FLOP/byte)"
    flashfftstencil:
      variant: stencil-tcu-matmul-kernel-fp16
      source_quality: fulltext (likun.tech ppopp25_FlashFFTStencil.pdf, §5.1) plus repo (src/2D/2d_main.cu)
      native_primary: "[timing] total execution time t AND GStencil/s together (§5.1 'Metrics'); headline Figure 6 plots execution time and speedup on H100. The 2D driver prints INPUT_WIDTH^2 * time / elapsed_ms / 1e6 (= cells * T / s / 1e9). Paper runs FP64 on A100 and H100; Table 3: 1D 512M points, 2D 16K x 16K, 3D 768^3, all 1000 time steps"
      also_reports:
        - "[timing] speedup over cuFFT/cuDNN (1.9x-103.0x), Brick (~5.8x), DRStencil (~2.9x), TCStencil (2.56x), ConvStencil (2.57x), LoRAStencil (2.44x, with LoRAStencil time x2 for its symmetry saving)"
        - "[hw] memory footprint vs standard FFT stencil (7-9x reduction), OOM points"
        - "counters: see per_paper_additional.flashfftstencil (Table 4: UGA, BC/R, PU; Fig. 10: AI and fragment sparsity)"
    spider:
      variant: stencil-tcu-matmul-kernel-fp16
      source_quality: fulltext (arxiv.org 2506.22035, §4.1) plus repo scripts
      native_primary: "[timing] GStencils/s = points updated per second / 1e9 (§4.1 'Metrics'); the binary prints m*n*times / t / 1e9 for its radius-7 FP16 SpTC sweep. Problem sizes: 1D (1, 10240000), 2D (10240, 10240)"
      plotted_normalization: >
        Figures 10/11 do not plot the raw number. scripts/Figure10_draw.py and
        Figure11_draw.py (unify_gstencil_sptc) divide it by 4 (FP16->FP64,
        §4.1 'we scale the results by a factor of 4') and multiply by 7/r,
        treating one radius-7 sweep as 7/r fused radius-r steps, to produce
        each Box-2D{1,2,3}R / 1D{1,2}R bar. The harness reports these as
        `derived` values next to the measured one; they are not separate
        radius-r measurements.
      also_reports:
        - "[timing] speedup 6.20x over cuDNN and 3.13x / 1.88x / 1.63x / 1.35x over TCStencil / ConvStencil / LoRAStencil / FlashFFTStencil (average)"
        - "counters: see per_paper_additional.spider"
        - "PROTOCOL NOTE: precision differs across the compared systems (cuDNN and ConvStencil run fp64, TCStencil fp16, SPIDER fp16) and the paper normalizes for it; keep each system's own precision as metadata"
  harness_implementation: >
    bench/kernelbench/domains/stencil.py `_native_stencil` recomputes each
    paper's native primary (and the secondary values above that come from
    the timed region) and writes them to the result record as
    metrics.paper_native: {paper, primary, metrics[], not_collected[],
    notes[]}. GCell-updates/s stays the cross-paper ranking metric; the
    report prints the paper metric under each row. AN5D additionally gets
    its paper statistic (mean of the timed reps) next to the median.
  convention_note: >
    Each paper's own FLOP-count convention and metric definition must be
    preserved and labeled, not normalized to a common definition. GFLOP/s
    figures using different per-point-update FLOP conventions (survey.md
    Divergence 4) are NOT comparable across papers and must not be plotted
    or ranked against each other. Do not apply retroactive x2/x4-style
    precision adjustments to a measured number to make it match a different
    paper's convention.

paper_baselines:
  note: >
    Added 2026-09-25 after re-reading each integrated paper's evaluation and
    artifact scripts (survey.md "Baselines each paper ran"). Every paper is
    run against the baselines it compared itself with, where an artifact
    exists and can be driven on this harness's workloads; the rest are listed
    with the reason. Machine-readable copy: kernelbench/domains/stencil.py
    PAPER_BASELINES (the report prints each paper's speedup over each).
  an5d:
    paper_baselines: "Loop tiling (PPCG), Hybrid tiling (PPCG, brute-force tuned), STENCILGEN (fixed parameters); AN5D Sconf vs Tuned is its own ablation"
    integrated: none
    why_not: "Loop/hybrid tiling are generated by PPCG at build time (khaki3/StencilBench@const, no CUDA checked in) and PPCG's pet frontend needs clang <= 3.8, the same blocker as AN5D's own generator. STENCILGEN's CUDA (khaki3/IEEE2017) covers only AN5D's named kernels, which the an5d adapter does not bridge yet."
  convstencil:
    paper_baselines: "cuDNN (FWD_IMPLICIT_PRECOMP_GEMM), AMOS, Brick, DRStencil, TCStencil"
    integrated: {cuDNN: cudnn-stencil}
    why_not: "AMOS (pku-liang/AMOS), Brick (CtopCsUtahEdu/bricklib) and TCStencil (buaa-hipo/TCStencil) have public artifacts that are not integrated; no public DRStencil artifact was located."
  lorastencil:
    paper_baselines: "cuDNN, AMOS, Brick, DRStencil, TCStencil, ConvStencil"
    integrated: {cuDNN: cudnn-stencil, ConvStencil: convstencil-tcu}
    why_not: "as ConvStencil"
  flashfftstencil:
    paper_baselines: "cuFFT (benchmarks/cufft-by-pytorch), cuDNN (benchmarks/cudnn/cudnn-test.cpp: fastest of all forward algorithms), Brick, DRStencil, TCStencil, ConvStencil, LoRAStencil (time x2)"
    integrated: {cuFFT: torch-cufft-stencil, cuDNN: cudnn-stencil-fastest, ConvStencil: convstencil-tcu}
    why_not: "LoRAStencil: the adapter runs star2d3r only and FlashFFTStencil box2d1r only, so they share no workload; Brick/DRStencil/TCStencil as ConvStencil."
  spider:
    paper_baselines: "cuDNN (ConvStencil's programs, fp64), DRStencil, TCStencil (pre-recorded A100 numbers in its repo), ConvStencil, LoRAStencil, FlashFFTStencil"
    integrated: {cuDNN: cudnn-stencil, ConvStencil: convstencil-tcu, FlashFFTStencil: flashfftstencil-box2d1r}
    comparison: "SPIDER's Figure 10 divides its fp16 radius-7 result by 4 and scales by 7/r, then compares with fp64 baselines on box2d{1,2,3}r at 10240^2, T=10240. The report reproduces that from the derived values, labeled derived; the measured same-precision comparison is against cuDNN fp16 on SPIDER's own box2d7r workload."
  cudnn_baseline_definitions: >
    Two cuDNN baselines, because the papers ran two: ConvStencil's
    src/cudnn/conv_*.cu (used by ConvStencil, LoRAStencil and SPIDER) fixes
    IMPLICIT_PRECOMP_GEMM; FlashFFTStencil's cudnn-test.cpp times every
    forward algorithm and keeps the fastest. Both ping-pong one
    cudnnConvolutionForward per step with zero padding (the domain's
    "zero-halo" boundary). torch-conv-stencil (circular F.pad + conv per
    step) is NOT any paper's baseline and stays only as a fallback yardstick.

shared_configurations:
  note: >
    "Same configuration": each paper's own evaluation point, run by every
    implementation that supports it (kernelbench/domains/stencil.py
    CROSS_PLAN; driver: bench/artifacts/stencil/cross_jobs.py, one GPU job
    per workload). An implementation that cannot run a workload records it as
    unsupported with the reason.
  cross-an5d: "AN5D §6.1: star2d1r, box2d1r, star2d3r, box2d3r at 16384^2 and star3d1r, box3d1r at 512^3, T=1000; fp64"
  cross-tcu-2d: "ConvStencil Table 4 / LoRAStencil Table II / SPIDER Figure 10 baselines: star2d1r, box2d1r, box2d2r, star2d3r, box2d3r at 10240^2, T=10240; fp64"
  cross-tcu-3d: "LoRAStencil Table II: star3d1r, box3d1r at 1024^3, T=1024; fp64 (no Tensor-Core adapter runs 3D; AN5D and the library baselines do)"
  cross-flashfft: "FlashFFTStencil Table 3 2D point: box2d1r at 16320^2, T=1; fp64. 16320 is the side nearest 16384 that both FlashFFTStencil (multiple of 6) and ConvStencil (multiple of 32 x 64) accept; T=1 because FlashFFTStencil's 2D driver re-applies one sweep instead of iterating"
  cross-spider-fp16: "SPIDER's own measured run: box2d7r at 10240^2, T=1, fp16, against cuDNN fp16"

notes_on_fairness:
  - "The paper-baseline comparisons (paper_baselines) are only as complete as the integrated baselines: 7 of the 12 distinct baseline systems the five papers name are not integrated (AMOS, Brick, DRStencil, TCStencil, PPCG loop/hybrid tiling, STENCILGEN), so a paper's speedup here covers its library baselines (cuDNN, cuFFT) and the other integrated papers, not its full comparison set."
  - "The Tensor-Core lineage compares FP16 and FP64 systems by dividing FP16 throughput by 4 (ConvStencil, LoRAStencil, FlashFFTStencil for TCStencil; SPIDER for itself), and FlashFFTStencil doubles LoRAStencil's time to undo its symmetry saving. These are the papers' own normalizations, recorded as `derived` values only; the harness never applies them to rank implementations."
  - "AN5D repeats 5x with 1 discarded warmup and reports the mean; every GPU Tensor-Core-stencil paper (ConvStencil, LoRAStencil, FlashFFTStencil, SPIDER), the GPU paper PERKS, and the CPU paper AOStencil publish a single, unrepeated, un-warmed-up trial in their public harness (PERKS's paper text separately states each evaluation was run ten times; only its repo driver is single-trial, RUNS = 1). Both kernel-only variants above mandate a discarded warmup + median-of->=5 (variant 1/2) regardless of what the underlying repo's default run does."
  - "ConvStencil's own correctness check (`tolerance=1e-7`) exists in source but is compiled out (`#define CHECK_ERROR` commented) in the public artifact — the published benchmark path runs with NO correctness check by default. This spec's correctness gate is mandatory, not opt-in."
  - "GFLOP/s is not comparable paper-to-paper in this track without a stated FLOP-per-point-update convention: PERKS hard-codes 17 FLOP/cell for one specific 9-point kernel; ConvStencil's printed GStencil/s multiplies launches by its temporal-fusion depth (x3), which only equals real steps when the run actually fuses. GCell-updates/s is made primary specifically because it depends only on grid size x iteration count, not on an assumed FLOP-counting convention (survey.md Divergence 4)."
  - "SPIDER's paper text states preprocessing/offline-transform cost is excluded from its reported throughput and is not otherwise quantified as a number for any of the 4 Tensor-Core-lineage papers surveyed. Variant 2 requires this be measured and reported once, not merely excluded and left unquantified."
  - "SPIDER's own 2D kernel synchronizes the device after every one of the T timed launches (not once at the end), which inflates the measured time with T-1 extra barrier stalls relative to ConvStencil/LoRAStencil's single-sync-at-the-end convention. Variant 2 standardizes on the single-sync form for both families so neither is penalized by a synchronization-granularity artifact rather than a real performance difference."
  - "StencilsOnFPGA and WindStencil/ozHOPE's application-level correctness checks (conserved quantities, roofline %) are not pointwise numerical tolerance gates the way PERKS/AOStencil's are; variant 3 keeps this weaker guarantee explicit rather than silently promoting it to the same rigor as variant 1/2."

